<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi plan de Bitcoin · Ciclo de 4 años</title>
<meta name="description" id="metaDesc" content="Mi plan de Bitcoin por el ciclo de 4 años: acumular en el suelo (DCA), holdear, tomar profit cerca del techo.">
<meta property="og:title" content="Bitcoin plan · 4-year cycle">
<meta property="og:description" content="Live traffic light of BTC's 4-year cycle: accumulate at the floor, hold, take profit near the top.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Bitcoin plan · 4-year cycle">
<meta name="twitter:description" content="Live traffic light of BTC's 4-year cycle. Accumulate at the floor, hold, take profit near the top.">
<style>
  :root{color-scheme:dark;
    --bg:#0b111b;--bg2:#0e1622;--panel:#141f2e;--panel2:#1a2738;--line:#243448;
    --ink:#e8eef7;--ink2:#aebccf;--muted:#7f92ab;--accent:#e8a13a;
    --bull:#2fd39b;--bear:#f2606d;--wait:#e8a13a;--hold:#3fa9f5;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace}
  *{box-sizing:border-box}html,body{margin:0}
  body{background:radial-gradient(1200px 600px at 78% -12%,color-mix(in oklab,var(--accent) 13%,transparent),transparent 60%),linear-gradient(var(--bg),var(--bg2));
    color:var(--ink);font-family:var(--font);line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
  .wrap{max-width:680px;margin:0 auto;padding:24px 16px 60px}
  .langbar{display:flex;justify-content:flex-end;gap:4px;margin-bottom:2px}
  .langbar button{background:transparent;border:1px solid var(--line);color:var(--muted);font:inherit;font-size:11px;font-weight:700;padding:3px 9px;border-radius:8px;cursor:pointer}
  .langbar button.on{color:var(--accent);border-color:var(--accent)}
  .kicker{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:700}
  h1{margin:6px 0 2px;font-size:clamp(23px,6vw,31px);font-weight:850;letter-spacing:-.02em}
  .sub{color:var(--ink2);font-size:14px;max-width:50ch}
  .live{margin-top:11px;font-family:var(--mono);font-size:13.5px;color:var(--ink2)}.live b{color:var(--ink)}
  .card{border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:0 24px 60px -34px rgba(0,0,0,.75)}
  .chartcard{margin-top:16px;padding:12px 12px 6px}
  #chart{width:100%;height:300px}
  .clegend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:11.5px;color:var(--muted);padding:4px 4px 8px}
  .clegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .signal{margin-top:16px;border-left:6px solid var(--sc,var(--muted));padding:18px 20px}
  .signal .lab{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .signal .ph{font-size:clamp(22px,6vw,29px);font-weight:850;letter-spacing:-.02em;color:var(--sc,var(--ink));margin:4px 0 3px}
  .signal .do{font-size:14.5px;color:var(--ink2);line-height:1.5}.signal .do b{color:var(--ink)}
  .lights{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .lt{flex:1 1 30%;min-width:130px;border:1px solid var(--line);border-radius:11px;background:var(--panel2);padding:9px 11px;display:flex;align-items:center;gap:8px;font-size:12.5px}
  .lt .d{width:9px;height:9px;border-radius:50%;flex:0 0 9px}.lt.on{border-color:color-mix(in oklab,var(--bull) 45%,var(--line))}
  .lt .nm{font-weight:750}.lt .st{color:var(--muted);font-size:11px}
  .cnt{margin-top:8px;font-size:11.5px;color:var(--muted);font-family:var(--mono);text-align:right}
  .ordcard{margin-top:16px;padding:16px 18px}
  .ordlab{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
  #dcaNote{font-size:13px;color:var(--ink2);margin:9px 0 10px;line-height:1.5}#dcaNote b{color:var(--ink)}
  .order{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
  .order .lv{font-family:var(--mono);font-weight:850;min-width:58px}.order .pc{color:var(--ink2);font-size:13px}
  .order .badge{margin-left:auto;font-size:11.5px;font-family:var(--mono)}
  .order.done{opacity:.55}.order.done .lv,.order.done .pc{text-decoration:line-through}
  .ordfoot{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5}.ordfoot b{color:var(--ink2)}
  .bar{margin-top:20px}
  .bar .track{position:relative;height:14px;border-radius:8px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);overflow:visible}
  .bar .fill{position:absolute;inset:0;border-radius:8px;background:linear-gradient(90deg,var(--bear) 2%,var(--wait) 22%,var(--bull) 38%,var(--hold) 70%,var(--bear));opacity:.85}
  .bar .floor{position:absolute;top:-3px;height:20px;background:color-mix(in oklab,var(--bull) 70%,transparent);border-radius:2px}
  .bar .you{position:absolute;top:-6px;width:4px;height:26px;border-radius:3px;background:#fff;box-shadow:0 0 0 3px var(--bg)}
  .bar .ends{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--muted);font-family:var(--mono)}
  .phases{margin-top:20px;display:grid;gap:9px}
  .p{border:1px solid var(--line);border-left:5px solid var(--pc);border-radius:12px;background:var(--panel);padding:12px 14px;display:flex;gap:11px;align-items:flex-start}
  .p.now{box-shadow:0 0 0 1px var(--pc),0 0 26px -8px var(--pc)}
  .p .dot{font-size:16px}.p .t{font-weight:800;font-size:14px}
  .p .t .when{font-weight:500;color:var(--muted);font-size:11.5px;font-family:var(--mono);margin-left:6px}
  .p .d{font-size:12.5px;color:var(--ink2);margin-top:2px}
  .p .nowtag{margin-left:auto;font-size:9px;font-weight:800;letter-spacing:.06em;color:var(--bg);background:var(--pc);padding:2px 7px;border-radius:999px;text-transform:uppercase;align-self:center}
  footer{margin-top:24px;color:var(--muted);font-size:12px;line-height:1.6;border-top:1px solid var(--line);padding-top:14px}
  footer b{color:var(--ink2)}.disc{margin-top:8px;font-size:11.5px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="langbar"><button id="btnEs">ES</button><button id="btnEn">EN</button></div>
  <div class="kicker" id="kicker"></div>
  <h1 id="h1"></h1>
  <div class="sub" id="sub"></div>
  <div class="live" id="live"></div>

  <div class="card chartcard">
    <div id="chart"></div>
    <div class="clegend" id="clegend"></div>
  </div>

  <div class="card signal" id="signal">
    <div class="lab" id="signalLab"></div>
    <div class="ph" id="phaseName">…</div>
    <div class="do" id="phaseDo"></div>
    <div class="lights" id="lights"></div>
    <div class="cnt" id="cnt"></div>
  </div>

  <div class="card ordcard" id="ordersCard" style="display:none">
    <div class="ordlab" id="ordLab"></div>
    <div id="dcaNote"></div>
    <div id="ladder"></div>
    <div class="ordfoot" id="ordFoot"></div>
  </div>

  <div class="bar">
    <div class="track"><div class="fill"></div><div class="floor" id="floorMark"></div><div class="you" id="youMark"></div></div>
    <div class="ends"><span id="endTop"></span><span id="endFloor"></span><span id="endNext"></span></div>
  </div>

  <div class="phases" id="phases"></div>
  <footer><span id="footMain"></span><div class="disc" id="footDisc"></div></footer>
</div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const DAY=864e5,WK=7*DAY,now=Date.now();
const TOP=Date.parse("2025-10-06"),FLOOR_S=Date.parse("2026-10-01"),FLOOR_E=Date.parse("2026-11-30"),NEXT_TOP=Date.parse("2029-10-01");
const TOPS=[["2013-11-01","2014-01-05"],["2017-12-01","2018-01-20"],["2021-10-15","2021-12-05"],["2025-09-20","2025-11-15"]];
const FLOORS=[["2015-01-01","2015-09-01"],["2018-11-01","2019-04-15"],["2022-06-15","2023-02-01"],["2026-09-15","2026-12-20"]];
const LADDER=[{lvl:60000,pct:20},{lvl:55000,pct:35},{lvl:50000,pct:45}];
const JUL1=Date.parse("2026-07-01");
const iso=ts=>new Date(ts).toISOString().slice(0,10);

// ── i18n ──
const T={es:{
  htmlTitle:"Mi plan de Bitcoin · Ciclo de 4 años",
  metaDesc:"Mi plan de Bitcoin por el ciclo de 4 años: acumular en el suelo (DCA), holdear, tomar profit cerca del techo.",
  kicker:"₿ Ciclo de 4 años", h1:"Mi plan de Bitcoin",
  sub:"No adivino el precio. Sigo el <b>ciclo de 4 años</b>: <b>acumular</b> en el suelo, <b>holdear</b> el ciclo, y <b>tomar beneficio</b> cerca del techo.",
  signalLab:"La señal ahora mismo",
  legTop:"Techo · vender", legFloor:"Suelo · acumular", legNow:"hoy",
  ordLab:"Órdenes de compra · escalonadas",
  ordFoot:'Cuanto más baja, <b>más compro</b>. La <b>artillería gorda</b> se despliega en la ventana de suelo (~oct-nov 2026) — para eso guardo liquidez. Después, sigo con el DCA.',
  dcaOn:(d)=>`🟢 <b>DCA arrancó</b> al romper <b>$60k</b> (${d}) — DCA <b>light</b> desde entonces. Órdenes escalonadas por debajo por si sigue cayendo:`,
  dcaOff:'El DCA arranca al romper <b>$60k</b>. Órdenes escalonadas por debajo por si el precio cae:',
  pctCap:"% del capital", bought:"comprado", placed:"orden puesta",
  endTop:"Techo · oct 2025", endFloor:"Suelo · ~oct-nov 2026", endNext:"Próx. techo · ~2029",
  weeksSince:"sem desde el techo", weeksSinceLong:"semanas desde el techo (oct 2025)",
  onCount:(n)=>`${n}/3 encendidas`,
  footMain:"<b>Cómo leerlo:</b> el semáforo marca en qué fase del ciclo estamos <b>hoy</b> y qué toca hacer. Se actualiza solo con la fecha y el precio.",
  footDisc:"Es <b>mi plan personal</b>, no asesoramiento financiero — cada uno hace el suyo y gestiona su riesgo. Las fechas son estimaciones del ciclo, no promesas.",
  phases:{
    top:{t:"Techo · Tomar profit",when:"cerca del máximo",d:"Vender de forma escalonada y pasar a estables. No enamorarse de la subida."},
    accum:{t:"Acumular · DCA ya",when:"bear → suelo",d:"<b>DCA pequeño YA</b> + órdenes límite escalonadas hacia el soporte. La <b>artillería gorda</b> queda para la ventana de suelo."},
    floor:{t:"Suelo · Desplegar",when:"~oct-nov 2026",d:"La ventana que espero. Desplegar la artillería: comprar el miedo con fuerza. Suele durar poco."},
    hold:{t:"Ciclo alcista · Holdear",when:"suelo → próx. techo",d:"Holdear lo acumulado (~3 años). No tocar hasta acercarse al siguiente techo."}
  },
  lights:{dca:"DCA continuo", lvl:"Nivel de suelo", win:"Ventana de suelo",
    active:"activo", holding:"holdeando", waiting:"esperando", waitOct:"esperando (~oct 26)", touching:"tocando", open:"abierta", dash:"—"}
},en:{
  htmlTitle:"My Bitcoin plan · 4-year cycle",
  metaDesc:"My Bitcoin plan around the 4-year cycle: accumulate at the floor (DCA), hold, take profit near the top.",
  kicker:"₿ 4-year cycle", h1:"My Bitcoin plan",
  sub:"I don't predict price. I follow the <b>4-year cycle</b>: <b>accumulate</b> at the floor, <b>hold</b> the cycle, and <b>take profit</b> near the top.",
  signalLab:"The signal right now",
  legTop:"Top · sell", legFloor:"Floor · accumulate", legNow:"now",
  ordLab:"Buy orders · laddered",
  ordFoot:'The lower it goes, <b>the more I buy</b>. The <b>heavy artillery</b> deploys in the floor window (~Oct-Nov 2026) — that\'s what the cash is for. After that, DCA continues.',
  dcaOn:(d)=>`🟢 <b>DCA started</b> when BTC broke <b>$60k</b> (${d}) — <b>light</b> DCA since then. Laddered orders below in case it keeps falling:`,
  dcaOff:'DCA starts when BTC breaks <b>$60k</b>. Laddered orders below in case price drops:',
  pctCap:"of capital", bought:"bought", placed:"order placed",
  endTop:"Top · Oct 2025", endFloor:"Floor · ~Oct-Nov 2026", endNext:"Next top · ~2029",
  weeksSince:"weeks since top", weeksSinceLong:"weeks since the top (Oct 2025)",
  onCount:(n)=>`${n}/3 on`,
  footMain:"<b>How to read it:</b> the traffic light shows which phase of the cycle we're in <b>today</b> and what to do. It updates itself from date and price.",
  footDisc:"This is <b>my personal plan</b>, not financial advice — everyone should make their own and manage their risk. Dates are cycle estimates, not promises.",
  phases:{
    top:{t:"Top · Take profit",when:"near the peak",d:"Sell in tranches and rotate to stables. Don't fall in love with the pump."},
    accum:{t:"Accumulate · DCA now",when:"bear → floor",d:"<b>Small DCA NOW</b> + laddered limit orders toward support. The <b>heavy artillery</b> is saved for the floor window."},
    floor:{t:"Floor · Deploy",when:"~Oct-Nov 2026",d:"The window I'm waiting for. Deploy the artillery: buy the fear with size. Usually short-lived."},
    hold:{t:"Bull market · Hold",when:"floor → next top",d:"Hold what you accumulated (~3 years). Don't touch until nearing the next top."}
  },
  lights:{dca:"Continuous DCA", lvl:"Floor level", win:"Floor window",
    active:"active", holding:"holding", waiting:"waiting", waitOct:"waiting (~Oct 26)", touching:"touching", open:"open", dash:"—"}
}};
let LANG=(navigator.language||"en").toLowerCase().startsWith("es")?"es":"en";
const saved=localStorage.getItem("btcplan-lang"); if(saved==="es"||saved==="en")LANG=saved;

function phaseNow(){ if(now<TOP)return "hold"; if(now<=FLOOR_E)return (now>=FLOOR_S)?"floor":"accum"; if(now<NEXT_TOP-180*DAY)return "hold"; return "top"; }
const PHASE_META=[{key:"top",c:"var(--bear)",dot:"🔴"},{key:"accum",c:"var(--bull)",dot:"🟢"},{key:"floor",c:"var(--bull)",dot:"🟢"},{key:"hold",c:"var(--hold)",dot:"🔵"}];
const cur=phaseNow();

let dcaStartTs=null, ladderTouch={}; // rellenado tras cargar precios

function render(){
  const t=T[LANG];
  document.documentElement.lang=LANG;
  document.title=t.htmlTitle; $("#metaDesc").setAttribute("content",t.metaDesc);
  $("#btnEs").classList.toggle("on",LANG==="es"); $("#btnEn").classList.toggle("on",LANG==="en");
  $("#kicker").textContent=t.kicker; $("#h1").textContent=t.h1; $("#sub").innerHTML=t.sub;
  $("#signalLab").textContent=t.signalLab;
  $("#clegend").innerHTML=`<span><i style="background:var(--bear)"></i>${t.legTop}</span><span><i style="background:var(--bull)"></i>${t.legFloor}</span><span><i style="background:#fff"></i>${t.legNow}</span>`;
  $("#ordLab").textContent=t.ordLab; $("#ordFoot").innerHTML=t.ordFoot;
  $("#endTop").textContent=t.endTop; $("#endFloor").textContent=t.endFloor; $("#endNext").textContent=t.endNext;
  $("#footMain").innerHTML=t.footMain; $("#footDisc").innerHTML=t.footDisc;

  // semáforo
  const pm=PHASE_META.find(p=>p.key===cur), ph=t.phases[cur];
  $("#signal").style.setProperty("--sc",pm.c);
  $("#phaseName").textContent=pm.dot+" "+ph.t; $("#phaseDo").innerHTML=ph.d;
  const inFloor=(cur==="floor"), L=t.lights;
  const LIGHTS=[
    {nm:L.dca, st:(cur==="accum"||inFloor)?L.active:(cur==="hold"?L.holding:L.dash), on:cur==="accum"||inFloor},
    {nm:L.lvl, st:inFloor?L.touching:L.waiting, on:inFloor},
    {nm:L.win, st:inFloor?L.open:L.waitOct, on:inFloor},
  ];
  $("#lights").innerHTML=LIGHTS.map(l=>`<div class="lt ${l.on?"on":""}"><span class="d" style="background:${l.on?"var(--bull)":"var(--muted)"}"></span><span><span class="nm">${l.nm}</span><br><span class="st">${l.st}</span></span></div>`).join("");
  $("#cnt").textContent=t.onCount(LIGHTS.filter(l=>l.on).length);

  // progreso
  const span=NEXT_TOP-TOP,pos=Math.max(0,Math.min(1,(now-TOP)/span));
  $("#youMark").style.left="calc("+(pos*100).toFixed(1)+"% - 2px)";
  $("#floorMark").style.left=((FLOOR_S-TOP)/span*100).toFixed(1)+"%"; $("#floorMark").style.width=Math.max(1.5,(FLOOR_E-FLOOR_S)/span*100).toFixed(1)+"%";

  // fases
  $("#phases").innerHTML=PHASE_META.map(p=>{const x=t.phases[p.key];return `<div class="p ${p.key===cur?"now":""}" style="--pc:${p.c}"><span class="dot">${p.dot}</span><div><div class="t">${x.t}<span class="when">${x.when}</span></div><div class="d">${x.d}</div></div>${p.key===cur?'<span class="nowtag">'+(LANG==="es"?"aquí":"here")+'</span>':''}</div>`;}).join("");

  // órdenes (si ya hay precios)
  if(dcaStartTs!==null||Object.keys(ladderTouch).length){
    $("#ordersCard").style.display="";
    $("#dcaNote").innerHTML=dcaStartTs?t.dcaOn(iso(dcaStartTs)):t.dcaOff;
    $("#ladder").innerHTML=LADDER.map(o=>{const tt=ladderTouch[o.lvl],done=tt!=null;
      return `<div class="order ${done?"done":""}"><span class="lv">$${o.lvl/1000}k</span><span class="pc">${o.pct}${LANG==="es"?"":"%"} ${t.pctCap}</span><span class="badge" style="color:${done?"var(--muted)":"var(--bull)"}">${done?"✅ "+t.bought+" "+iso(tt):"● "+t.placed}</span></div>`;
    }).join("");
  }
  // live (con lo que haya)
  updateLive();
}
let LIVE_PX=null;
function updateLive(){
  const t=T[LANG], wk=Math.floor((now-TOP)/WK);
  if(LIVE_PX&&LIVE_PX.usd){const up=(LIVE_PX.usd_24h_change||0)>=0;
    $("#live").innerHTML=`BTC <b>$${Number(LIVE_PX.usd).toLocaleString(LANG==="es"?"es-ES":"en-US",{maximumFractionDigits:0})}</b> <span style="color:${up?"var(--bull)":"var(--bear)"}">${up?"▲":"▼"} ${Math.abs(LIVE_PX.usd_24h_change||0).toFixed(1)}%</span> · <b>${wk}</b> ${t.weeksSince}`;
  }else $("#live").innerHTML=`<b>${wk}</b> ${t.weeksSinceLong}`;
}
$("#btnEs").addEventListener("click",()=>{LANG="es";localStorage.setItem("btcplan-lang","es");render();});
$("#btnEn").addEventListener("click",()=>{LANG="en";localStorage.setItem("btcplan-lang","en");render();});
render();

// precio en vivo
(async function(){try{const r=await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd&include_24hr_change=true");LIVE_PX=(await r.json()).bitcoin;updateLive();}catch(e){}})();

// ── gráfico + órdenes ──
function loadScript(u){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=u;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
async function loadPlotly(){if(window.Plotly)return;for(const u of["https://cdn.plot.ly/plotly-2.27.0.min.js","https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.27.0/plotly.min.js"]){try{await loadScript(u);if(window.Plotly)return;}catch(e){}}throw new Error("plotly");}
function band(r,c,o){return {type:"rect",xref:"x",yref:"paper",x0:r[0],x1:r[1],y0:0,y1:1,fillcolor:c,opacity:o,line:{width:0},layer:"below"};}
(async function(){
  let prices=null;
  try{await loadPlotly();const r=await fetch("https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=usd&days=max");prices=(await r.json()).prices;}catch(e){}
  if(!prices||!prices.length){document.querySelector(".chartcard").style.display="none";return;}
  const firstTouch=(lvl,from)=>{for(const p of prices){if(p[0]>=from&&p[1]<=lvl)return p[0];}return null;};
  dcaStartTs=firstTouch(60000,TOP);
  LADDER.forEach(o=>{ladderTouch[o.lvl]=firstTouch(o.lvl,JUL1);});
  render(); // re-render con las órdenes ya calculadas
  if(!window.Plotly){document.querySelector(".chartcard").style.display="none";return;}
  const xs=[],ys=[];for(let i=0;i<prices.length;i+=3){xs.push(iso(prices[i][0]));ys.push(prices[i][1]);}
  const shapes=[];
  for(const tp of TOPS)shapes.push(band(tp,"#f2606d",.16));
  for(const f of FLOORS)shapes.push(band(f,"#2fd39b",.15));
  LADDER.forEach(o=>shapes.push({type:"line",xref:"paper",x0:0,x1:1,y0:o.lvl,y1:o.lvl,line:{color:"#e8a13a",width:1,dash:"dot"},opacity:.45,layer:"below"}));
  if(dcaStartTs)shapes.push({type:"line",xref:"x",yref:"paper",x0:iso(dcaStartTs),x1:iso(dcaStartTs),y0:0,y1:1,line:{color:"#2fd39b",width:1,dash:"dash"}});
  shapes.push({type:"line",xref:"x",yref:"paper",x0:iso(now),x1:iso(now),y0:0,y1:1,line:{color:"#fff",width:1.5,dash:"dot"}});
  const layout={paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"rgba(0,0,0,0)",margin:{l:44,r:8,t:6,b:24},height:300,font:{color:"#7f92ab",size:10,family:"inherit"},showlegend:false,shapes,
    xaxis:{gridcolor:"rgba(255,255,255,.04)",linecolor:"#243448",color:"#7f92ab",type:"date",range:["2012-06-01",iso(NEXT_TOP+60*DAY)]},
    yaxis:{type:"log",gridcolor:"rgba(255,255,255,.05)",linecolor:"#243448",color:"#7f92ab",tickprefix:"$",tickvals:[10,100,1000,10000,100000],ticktext:["$10","$100","$1k","$10k","$100k"]}};
  window.Plotly.react("chart",[{x:xs,y:ys,mode:"lines",line:{color:"#eef2f8",width:1.4},hovertemplate:"%{x}<br>$%{y:,.0f}<extra></extra>"}],layout,{responsive:true,displayModeBar:false});
})();
