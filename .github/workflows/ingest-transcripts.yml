name: Ingesta diaria de transcripts (YouTube)

# ⚠️ SIN CRON A PROPÓSITO — la ingesta de transcripts vive AHORA EN LOCAL.
#
# YouTube bloquea las IPs de datacenter de los runners de GitHub:
#   ERROR: [youtube] Sign in to confirm you're not a bot.
# Comprobado el 17-ago-2026 en ambos canales. No es yt-dlp desactualizado ni los
# player_client caducados: es la IP. Desde una IP doméstica funciona.
#
# La ingesta real la hace `ingesta/local/ingesta_local.sh` en la máquina del usuario
# (ver ingesta/local/README.md). Este workflow se queda solo como disparador manual,
# por si algún día YouTube deja de bloquear o se añaden cookies en un secret.
#
# Se le quitó el cron para que no salga en rojo cada día: un workflow permanentemente
# rojo enseña a ignorar el rojo, y eso es justo lo que queremos evitar. Quien vigila
# ahora que los transcripts no se queden viejos es `frescura.yml`, que mira el DATO.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ingest-transcripts
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar yt-dlp
        run: python -m pip install --quiet yt-dlp
      # OJO: NO poner continue-on-error aquí. Lo tuvo, y con el swallow de errores de
      # list_videos() el job salió VERDE 4 semanas seguidas sin traer un solo transcript
      # (16-jul → 16-ago-2026). Un canal ilegible tiene que romper el job y avisar.
      # Cada canal usa `id` para poder commitear lo que sí se haya bajado aunque el otro falle.
      - name: LMEC (es)
        id: lmec
        run: |
          python agentes/tools/fetch_captions.py --persona lmec --lang es --max 5 \
            --since $(date -u -d '10 days ago' +%Y%m%d) \
            "https://www.youtube.com/@LaMejorEstrategiaCriptomonedas/videos"
      - name: Cowen (en)
        id: cowen
        if: always()
        run: |
          python agentes/tools/fetch_captions.py --persona cowen --lang en --max 5 \
            --since $(date -u -d '10 days ago' +%Y%m%d) \
            "https://www.youtube.com/@benjaminjcowen/videos"
      - name: Commit de transcripts nuevos
        if: always()
        run: |
          git config user.name "transcript-bot"
          git config user.email "actions@users.noreply.github.com"
          git add agentes/*/yt-transcripts/
          git diff --cached --quiet || git commit -m "transcripts: ingesta diaria [skip ci]"
          git push
