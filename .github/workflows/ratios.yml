name: Ratios contra BTC

on:
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar ratios
        run: python3 ingesta/fetch_ratios.py
      - name: Commit
        run: |
          git config user.name "ratios-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ratios
          git diff --cached --quiet || {
            git commit -m "ratios: ingesta diaria [skip ci]"
            git pull --rebase origin main && git push
          }
