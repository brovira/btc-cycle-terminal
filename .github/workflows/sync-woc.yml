name: Sincronizar Week On-Chain al dashboard

# Cierra la cadena: el pipeline del repo privado (DeFi-Tracker, jueves 13:00 UTC) ingiere el WoC
# nuevo y emite su recomendación → este workflow (14:00 UTC) la trae a data/woc_semana.json, que
# es lo que muestra la sección "Qué hacemos esta semana" de vol.html.
#
# Antes de esto, ese JSON estaba escrito a mano y NUNCA se actualizaba solo.

on:
  schedule:
    - cron: "0 14 * * 4"      # jueves 14:00 UTC, 1h después del pipeline privado
  workflow_dispatch:
    inputs:
      forzar:
        description: "Reescribir aunque la fecha coincida"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-woc
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Antes de sincronizar, comprobar que el clasificador de fiabilidad no está roto.
      # Si clasifica mal, el dashboard muestra la nota del track record equivocada y NADA
      # se pone rojo: devolver una etiqueta incorrecta es indistinguible de la correcta.
      # Mejor no sincronizar que sincronizar con las notas mal atribuidas.
      - name: Test del clasificador de fiabilidad
        run: python ingesta/test_fiabilidad.py
      # Se paga con la suscripción (CLAUDE_CODE_OAUTH_TOKEN), no con la API: la recomendación
      # cuando el pipeline privado la deja PENDIENTE, y los informes destilados del agente.
      - name: Instalar Claude Code
        run: curl -fsSL https://claude.ai/install.sh | bash
      - name: Sincronizar
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          python ingesta/sync_woc.py ${{ inputs.forzar && '--forzar' || '' }}
      # El paso de arriba trae la RECOMENDACIÓN al dashboard. Este trae los INFORMES que lee
      # el agente `glassnode_woc` para citar, que hasta el 17-ago-2026 no los escribía nadie.
      - name: Destilar los informes que falten
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          python ingesta/sync_woc_reports.py
      - name: Commit
        if: always()          # sube lo que haya entrado aunque el destilado falle
        run: |
          git config user.name "woc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/woc_semana.json agentes/glassnode_woc/reports/
          git diff --cached --quiet || git commit -m "woc: sincronizar semana desde el KB [skip ci]"
          git push
