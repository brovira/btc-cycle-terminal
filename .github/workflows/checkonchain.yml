name: Checkonchain — catálogo y extracción

# Manual. Checkonchain publica gratis cientos de charts (on-chain, técnico, derivados, ETFs,
# treasury). Sus páginas públicas son cáscaras que apuntan a charts-cdn.checkonchain.com,
# donde el chart real es un export de Plotly con los datos embebidos.
#
# Este workflow: lista el catálogo, inspecciona el formato y extrae series de prueba.
# Uso PERSONAL (lectura para validar/extender backtests), no redistribución.
#
# Resultado: data/checkonchain/ (informe + series extraídas), commiteado.

on:
  schedule:
    # Diario 07:30 UTC, media hora después de onchain.yml para no solapar los dos commits.
    # Antes esto era SOLO workflow_dispatch: no fallaba, es que nadie lo lanzaba. La última
    # extracción manual fue el 30-jul-2026 y data/checkonchain/ se quedó congelado 17 días
    # mientras el resto del pipeline seguía en verde. El modo por defecto del cron es 'lote'.
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "auto (catálogo+inspección+prueba) · catalogo · inspeccionar · extraer"
        type: choice
        options: [lote, auto, catalogo, inspeccionar, extraer]
        default: lote
      ruta:
        description: "Ruta del chart (solo para inspeccionar/extraer). Ej: btconchain/pricing/pricing_realisedprice/pricing_realisedprice_light.html"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: checkonchain
  cancel-in-progress: false

jobs:
  extraer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ejecutar
        run: |
          # En el cron no hay inputs: por defecto 'lote' (la extracción completa que
          # alimenta data/checkonchain/), no 'auto' (que es catálogo + inspección de prueba).
          case "${{ inputs.modo || 'lote' }}" in
            catalogo)     python ingesta/checkonchain.py --catalogo ;;
            inspeccionar) python ingesta/checkonchain.py --inspeccionar "${{ inputs.ruta }}" ;;
            extraer)      python ingesta/checkonchain.py --extraer "${{ inputs.ruta }}" ;;
            lote)         python ingesta/checkonchain.py --lote ;;
            *)            python ingesta/checkonchain.py --auto ;;
          esac
      - name: Commit
        run: |
          git config user.name "onchain-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/checkonchain/ || true
          git diff --cached --quiet || git commit -m "checkonchain: catálogo/extracción [skip ci]"
          git push
