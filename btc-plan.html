  /* ── backtest ── */
  .bt{margin-top:14px;padding:16px 16px 18px}
  .btlead{font-size:13.5px;color:var(--ink2);line-height:1.55;margin:2px 2px 14px}.btlead b{color:var(--ink)}

  .bttable{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}
  .bttable th{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}

  .bttable td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--mono)}
  .bttable td:first-child{text-align:left;font-family:var(--font)}

  .bttable tr.best{background:color-mix(in oklab,var(--bull) 9%,transparent)}

  .btload{padding:24px 6px;text-align:center;color:var(--muted);font-size:13px}

  .phcard{margin-top:14px;padding:14px 12px 12px}
  .phbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;margin-bottom:6px}
  .phbtn{background:transparent;border:1px solid var(--line);color:var(--muted);font:inherit;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:8px;cursor:pointer}
  .phbtn.on{color:var(--accent);border-color:var(--accent)}
  #phaseChart{width:100%;height:380px}
  .phnote{margin-top:8px;font-size:11px;color:var(--muted);line-height:1.55}.phnote b{color:var(--ink2)}.phnote i{color:var(--ink2)}

  .phases{margin-top:14px;display:grid;gap:9px}
  .p{border:1px solid var(--line);border-left:5px solid var(--pc);border-radius:12px;background:var(--panel);padding:12px 14px;display:flex;gap:11px;align-items:flex-start}
  .p.now{box-shadow:0 0 0 1px var(--pc),0 0 26px -8px var(--pc)}
  .p .dot{font-size:16px}.p .t{font-weight:800;font-size:14px}
  .p .t .when{font-weight:500;color:var(--muted);font-size:11.5px;font-family:var(--mono);margin-left:6px}
  .p .d{font-size:12.5px;color:var(--ink2);margin-top:2px}
  .p .nowtag{margin-left:auto;font-size:9px;font-weight:800;letter-spacing:.06em;color:var(--bg);background:var(--pc);padding:2px 7px;border-radius:999px;text-transform:uppercase;align-self:center}
  footer{margin-top:24px;color:var(--muted);font-size:12px;line-height:1.6;border-top:1px solid var(--line);padding-top:14px}
  footer b{color:var(--ink2)}.disc{margin-top:8px;font-size:11.5px;color:var(--muted)}
</style>
</head>

// ══════════ backtest (motor propio, client-side, solo precio) ══════════
function sma(a,n){const o=Array(a.length).fill(null);let s=0;for(let i=0;i<a.length;i++){s+=a[i];if(i>=n)s-=a[i-n];if(i>=n-1)o[i]=s/n;}return o;}
function ema(a,n){const o=Array(a.length).fill(null),k=2/(n+1);let p=null,ss=0,sd=false;for(let i=0;i<a.length;i++){const v=a[i];if(v==null){o[i]=null;continue;}if(!sd){ss+=v;if(i>=n-1){p=ss/n;o[i]=p;sd=true;}continue;}p=v*k+p*(1-k);o[i]=p;}return o;}
// riesgo 0-1 estilo Cowen: desviación de log(precio) sobre regresión log-log, walk-forward (sin lookahead)
function riskSeries(T_,C){const t0=Date.parse("2009-01-03"),out=Array(T_.length).fill(null);
  let n=0,sx=0,sy=0,sxx=0,sxy=0,dmin=Infinity,dmax=-Infinity;
  for(let i=0;i<T_.length;i++){const w=(T_[i]-t0)/WK,c=C[i];if(!(w>0)||!(c>0))continue;
    const x=Math.log(w),y=Math.log(c);n++;sx+=x;sy+=y;sxx+=x*x;sxy+=x*y;if(n<52)continue;
    const den=n*sxx-sx*sx;if(!(den>0))continue;const b=(n*sxy-sx*sy)/den,a=(sy-b*sx)/n,d=y-(a+b*x);
    if(d<dmin)dmin=d;if(d>dmax)dmax=d;if(dmax>dmin)out[i]=(d-dmin)/(dmax-dmin);}
  return out;}
// 2ª ruptura al alza de la BMSB (LMEC): 1 en la barra de la 2ª ruptura tras un bear
function bmsb2Series(C){const n=C.length,s20=sma(C,20),e21=ema(C,21);
  const hi=i=>(s20[i]!=null&&e21[i]!=null)?Math.max(s20[i],e21[i]):null,lo=i=>(s20[i]!=null&&e21[i]!=null)?Math.min(s20[i],e21[i]):null;
  const ev=[];let state=null;
  for(let i=1;i<n;i++){const H=hi(i),Lw=lo(i);if(H==null)continue;
    const aC=C[i]>H&&hi(i-1)!=null&&C[i-1]>hi(i-1),bC=C[i]<Lw&&lo(i-1)!=null&&C[i-1]<lo(i-1);
    if(aC&&state!=="up"){if(state)ev.push([i,"up"]);state="up";}
    else if(bC&&state!=="down"){if(state)ev.push([i,"down"]);state="down";}
    else if(state==null){state=C[i]>H?"up":(C[i]<Lw?"down":null);}}
  const out=Array(n).fill(0);let inBear=false,ups=0,lastUp=null;
  for(const[i,tp]of ev){if(tp==="up"){lastUp=i;if(inBear){ups++;if(ups===2){out[i]=1;inBear=false;}}}
    else{const bl=lastUp!=null?(i-lastUp):999;if(bl>=40){inBear=true;ups=0;}}}
  return out;}

// simula una serie booleana "dentro/fuera" → curva de capital + métricas
function simulate(T_,C,inMkt){
  const eq=Array(C.length).fill(1);let e=1,peak=1,maxdd=0;
  for(let i=1;i<C.length;i++){const r=inMkt[i-1]?(C[i]/C[i-1]-1):0;e*=(1+r);eq[i]=e;if(e>peak)peak=e;const dd=1-e/peak;if(dd>maxdd)maxdd=dd;}
  const yrs=(T_[T_.length-1]-T_[0])/(365.25*DAY);
  const cagr=yrs>0?(Math.pow(e,1/yrs)-1):0;
  return {eq,mult:e,cagr,maxdd};
}
// máquina de estados genérica: enterFn/exitFn(i)->bool ; devuelve serie dentro/fuera
function stateMachine(n,enterFn,exitFn,start){let inM=!!start;const out=Array(n).fill(false);
  for(let i=0;i<n;i++){if(!inM&&enterFn(i))inM=true;else if(inM&&exitFn(i))inM=false;out[i]=inM;}return out;}

function runBacktest(prices){
  // remuestreo a semanal (cierre de cada bloque de 7 días)
  const T_=[],C=[];let bs=null,bc=null,bt=null;
  for(const[ms,p]of prices){if(bs==null){bs=ms;bc=p;bt=ms;}else if(ms-bs>=WK){T_.push(bt);C.push(bc);bs=ms;bc=p;bt=ms;}else{bc=p;bt=ms;}}
  if(bs!=null){T_.push(bt);C.push(bc);}
  if(C.length<80)return null;
  const n=C.length, risk=riskSeries(T_,C), b2=bmsb2Series(C);
  const val=x=>x==null?null:x;
  // LMEC: entra en 2ª ruptura BMSB, sale cuando el riesgo entra en euforia (>0.82)
  const lmec=stateMachine(n,i=>b2[i]===1,i=>val(risk[i])!=null&&risk[i]>0.82,false);
  // Cowen: entra risk<0.30, sale risk>0.60
  const cowen=stateMachine(n,i=>val(risk[i])!=null&&risk[i]<0.30,i=>val(risk[i])!=null&&risk[i]>0.60,false);
  // OnChainMind: compra la zona (risk<0.45), holdea hasta que se calienta mucho (risk>0.78)
  const ocm=stateMachine(n,i=>val(risk[i])!=null&&risk[i]<0.45,i=>val(risk[i])!=null&&risk[i]>0.78,false);
  // Consenso: dentro cuando ≥2 de las 3 coinciden
  const cons=Array(n);for(let i=0;i<n;i++)cons[i]=((lmec[i]?1:0)+(cowen[i]?1:0)+(ocm[i]?1:0))>=2;
  const hodl=Array(n).fill(true);
  const R={
    T:T_,
    hodl:simulate(T_,C,hodl), lmec:simulate(T_,C,lmec), cowen:simulate(T_,C,cowen),
    ocm:simulate(T_,C,ocm), cons:simulate(T_,C,cons)
  };
  return R;
}

  const rows=[

  ];
  const hodlMult=R.hodl.mult;
  const fmtMult=x=>x>=100?Math.round(x).toLocaleString():x>=10?x.toFixed(0):x.toFixed(1);
  const fmtPct=x=>(x*100).toFixed(0);
  const table=`<table class="bttable"><thead><tr>${t.btCols.map((c,i)=>`<th>${c}</th>`).join("")}</tr></thead><tbody>`+
    rows.map(r=>{const vs=r.m.mult/hodlMult;const best=r.k==="cons"||(r.k!=="hodl"&&vs>=1);
      return `<tr class="${r.k==="hodl"?"hodl":""} ${best?"best":""}">
        <td><span class="stratdot" style="background:${BT_COLORS[r.k]}"></span><span class="stratname">${r.n}</span><span class="stratrule">${r.r}</span></td>
        <td>×${fmtMult(r.m.mult)}</td>
        <td>${fmtPct(r.m.cagr)}%</td>
        <td class="neg">−${fmtPct(r.m.maxdd)}%</td>
        <td class="${vs>=1?"pos":"neg"}">${r.k==="hodl"?"—":(vs>=1?"+":"")+((vs-1)*100).toFixed(0)+"%"}</td></tr>`;}).join("")+
    `</tbody></table>`;
  // veredicto dinámico y HONESTO sobre el consenso (se adapta a los números reales)
  const c=R.cons, h=R.hodl, beat=c.mult>=h.mult, ddBetter=c.maxdd<h.maxdd-0.05;
  let vtxt=(beat?t.vf.beat:t.vf.near)(t.stratCons.n, fmtMult(c.mult), fmtMult(h.mult))
          +(ddBetter?t.vf.ddbetter(fmtPct(c.maxdd),fmtPct(h.maxdd)):t.vf.ddsame(fmtPct(c.maxdd)))
          +((!beat&&ddBetter)?t.vf.tag:"");
  const verdict=`<div class="btverdict">${vtxt}</div>`;
  body.innerHTML=`<div id="btEquity"></div>${table}${verdict}<div class="btnote">${t.btNote}</div>`;
  drawEquity(R,rows);
}
function drawEquity(R,rows){
  if(!window.Plotly){$("#btEquity").style.display="none";return;}
  const xs=R.T.map(iso);
  const traces=rows.map(r=>({x:xs,y:r.m.eq,mode:"lines",name:r.n,
    line:{color:BT_COLORS[r.k],width:r.k==="cons"?2.4:(r.k==="hodl"?1.6:1.3),dash:r.k==="hodl"?"dot":"solid"},
    hovertemplate:"%{x}<br>×%{y:,.1f}<extra>"+r.n+"</extra>"}));
  const layout={paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"rgba(0,0,0,0)",margin:{l:44,r:8,t:6,b:22},height:230,
    font:{color:"#7f92ab",size:10,family:"inherit"},showlegend:true,legend:{orientation:"h",font:{size:9},y:1.14,x:0},
    xaxis:{gridcolor:"rgba(255,255,255,.04)",linecolor:"#243448",color:"#7f92ab",type:"date"},
    yaxis:{type:"log",gridcolor:"rgba(255,255,255,.05)",linecolor:"#243448",color:"#7f92ab",title:{text:"× (log)",font:{size:9}}}};
  window.Plotly.react("btEquity",traces,layout,{responsive:true,displayModeBar:false});
}

// ══════════ grafico de confluencia (portado fiel de decision.html) ══════════
const PH_HALVINGS=["2012-11-28","2016-07-09","2020-05-11","2024-04-19","2028-04-20"].map(d=>Date.parse(d));
const PH_WKMS=7*DAY;
const CYCLE_EV=[["H1","2012-11-28"],["T1","2013-12-04"],["B1","2015-01-14"],["H2","2016-07-09"],["T2","2017-12-17"],
  ["B2","2018-12-15"],["H3","2020-05-11"],["T3","2021-11-10"],["B3","2022-11-21"],["H4","2024-04-19"],["T4","2025-10-06"]];
const CYCLE_TOPS_MS=CYCLE_EV.filter(e=>/^T/.test(e[0])).map(e=>Date.parse(e[1]));
const CYCLE_BOTS_MS=CYCLE_EV.filter(e=>/^B/.test(e[0])).map(e=>Date.parse(e[1]));
const PATRON_EXTRA_TOPS_MS=[Date.parse("2011-06-08")];
const PATRON_EXTRA_SELL_TOPS_MS=[Date.parse("2011-06-08"),Date.parse("2013-12-04")];
function patronBuyBase(){return CYCLE_TOPS_MS.map(T_=>({t0:T_+52*PH_WKMS,t1:T_+58*PH_WKMS}));}
function patronBuy(){return[...PATRON_EXTRA_TOPS_MS.map(T_=>({t0:T_+52*PH_WKMS,t1:T_+58*PH_WKMS})),...patronBuyBase()];}
function patronSell(){return[...PATRON_EXTRA_SELL_TOPS_MS.map(T_=>({t0:T_-2*PH_WKMS,t1:T_+2*PH_WKMS})),...CYCLE_BOTS_MS.map(B=>({t0:B+150*PH_WKMS,t1:B+153*PH_WKMS}))];}
function patronIntervals(){return patronBuyBase();}
function lmecIntervals(){const buy=[],sell=[];for(const T_ of CYCLE_TOPS_MS){sell.push({t0:T_-8*PH_WKMS,t1:T_+2*PH_WKMS});buy.push({t0:T_+50*PH_WKMS,t1:T_+58*PH_WKMS});}return{buy,sell};}
function cowenIntervals(){const buyStrong=[],buySoft=[],sell=[];for(const H of PH_HALVINGS){const Y0=new Date(H).getUTCFullYear();
  sell.push({t0:Date.parse(`${Y0+1}-10-01`),t1:Date.parse(`${Y0+1}-12-31`)});
  buyStrong.push({t0:Date.parse(`${Y0+2}-07-01`),t1:Date.parse(`${Y0+2}-12-31`)});
  buySoft.push({t0:Date.parse(`${Y0+3}-01-01`),t1:Date.parse(`${Y0+3}-06-30`)});}return{buyStrong,buySoft,sell};}
function ivMerge(list){const s=list.slice().sort((a,b)=>a.t0-b.t0);const out=[];for(const iv of s){if(out.length&&iv.t0<=out[out.length-1].t1)out[out.length-1].t1=Math.max(out[out.length-1].t1,iv.t1);else out.push({...iv});}return out;}
function ivIntersect(a,b){const out=[];let i=0,j=0;while(i<a.length&&j<b.length){const lo=Math.max(a[i].t0,b[j].t0),hi=Math.min(a[i].t1,b[j].t1);if(lo<hi)out.push({t0:lo,t1:hi});if(a[i].t1<b[j].t1)i++;else j++;}return out;}
function ivSubtract(a,removeList){const rem=ivMerge(removeList);let out=a.slice();for(const r of rem){const next=[];for(const iv of out){if(r.t1<=iv.t0||r.t0>=iv.t1){next.push(iv);continue;}if(r.t0>iv.t0)next.push({t0:iv.t0,t1:Math.min(r.t0,iv.t1)});if(r.t1<iv.t1)next.push({t0:Math.max(r.t1,iv.t0),t1:iv.t1});}out=next;}return out;}
function classify3(A,B,C){const ab=ivIntersect(A,B),ac=ivIntersect(A,C),bc=ivIntersect(B,C);const abc=ivIntersect(ab,C);
  const twoOnly=ivSubtract(ivMerge([...ab,...ac,...bc]),abc);
  const aOnly=ivSubtract(A,ivMerge([...ab,...ac])),bOnly=ivSubtract(B,ivMerge([...ab,...bc])),cOnly=ivSubtract(C,ivMerge([...ac,...bc]));
  return{abc,twoOnly,aOnly,bOnly,cOnly};}
function phRect(x0,x1,color){return{type:"rect",xref:"x",yref:"paper",x0,x1,y0:0,y1:1,fillcolor:color,line:{width:0},layer:"below"};}
function rectsFromIv(ivs,color){return ivs.map(iv=>phRect(iso(iv.t0),iso(iv.t1),color));}
function bandShapes(mode){const L=lmecIntervals(),C=cowenIntervals(),P=patronIntervals();
  if(mode==="lmec")return[...rectsFromIv(L.buy,"rgba(47,195,155,0.16)"),...rectsFromIv(L.sell,"rgba(242,163,63,0.16)")];
  if(mode==="cowen")return[...rectsFromIv(C.buyStrong,"rgba(47,195,155,0.16)"),...rectsFromIv(C.buySoft,"rgba(63,169,245,0.16)"),...rectsFromIv(C.sell,"rgba(242,163,63,0.16)")];
  if(mode==="patron")return[...rectsFromIv(patronBuy(),"rgba(47,195,155,0.18)"),...rectsFromIv(patronSell(),"rgba(242,163,63,0.18)")];
  const lmecBuy=ivMerge(L.buy),lmecSell=ivMerge(L.sell),cowenSell=ivMerge(C.sell),patron=ivMerge(P);
  const cowenBuyAll=ivMerge([...C.buyStrong,...C.buySoft]);
  const buy=classify3(lmecBuy,cowenBuyAll,patron);
  const sellOverlap=ivIntersect(lmecSell,cowenSell);
  const bOnlyStrong=ivIntersect(buy.bOnly,ivMerge(C.buyStrong)),bOnlySoft=ivSubtract(buy.bOnly,bOnlyStrong);
  return[...rectsFromIv(buy.aOnly,"rgba(47,195,155,0.10)"),...rectsFromIv(bOnlyStrong,"rgba(47,195,155,0.10)"),
    ...rectsFromIv(bOnlySoft,"rgba(63,169,245,0.10)"),...rectsFromIv(buy.cOnly,"rgba(155,140,255,0.16)"),
    ...rectsFromIv(ivSubtract(lmecSell,sellOverlap),"rgba(242,163,63,0.11)"),...rectsFromIv(ivSubtract(cowenSell,sellOverlap),"rgba(242,163,63,0.11)"),
    ...rectsFromIv(buy.twoOnly,"rgba(34,211,153,0.32)"),...rectsFromIv(buy.abc,"rgba(250,204,21,0.45)"),...rectsFromIv(sellOverlap,"rgba(248,113,113,0.34)")];}
function weeklyResample(prices){const t=[],c=[];let bs=null,bc,bt;for(const[ms,p]of prices){if(bs==null){bs=ms;bc=p;bt=ms;continue;}if(ms-bs>=WK){t.push(bt);c.push(bc);bs=ms;bc=p;bt=ms;}else{bc=p;bt=ms;}}if(bs!=null){t.push(bt);c.push(bc);}return{t,c};}
function renderPhBtns(){const t=T[LANG],modes=["lmec","cowen","patron","todos"];const box=$("#phBtns");if(!box)return;
  box.innerHTML=modes.map(m=>`<button class="phbtn ${m===PH_MODE?"on":""}" data-ph="${m}">${t.phBtns[m]}</button>`).join("");
  box.querySelectorAll(".phbtn").forEach(b=>b.addEventListener("click",()=>{PH_MODE=b.dataset.ph;renderPhBtns();if(PH_D)renderPhaseChart(PH_D);}));}
function renderPhaseChart(D){
  if(!window.Plotly||!D||!D.c.length){const el=$("#phaseChart");if(el)el.style.display="none";return;}
  const t=T[LANG],xs=D.t.map(iso),s20=sma(D.c,20),e21=ema(D.c,21),s200=sma(D.c,200);
  const bm=D.c.map((_,i)=>(s20[i]!=null&&e21[i]!=null)?Math.max(s20[i],e21[i]):null),m2=s200;
  PH_XS=xs;PH_YS=D.c;PH_BM=bm;PH_M2=m2;
  $("#phaseNote").innerHTML=t.phNotes[PH_MODE]+t.phSince;
  const traces=[
    {x:xs,y:D.c,type:"scatter",mode:"lines",name:"BTC",line:{color:"#e8eef7",width:1.5},hovertemplate:"%{x}<br>$%{y:,.0f}<extra></extra>"},
    {x:xs,y:bm,type:"scatter",mode:"lines",name:"BMSB",line:{color:"#e8a13a",width:1,dash:"dot"}},
    {x:xs,y:m2,type:"scatter",mode:"lines",name:"200W MA",line:{color:"#3fa9f5",width:1,dash:"dash"}},
  ];
  const xEnd=iso(Math.max(D.t[D.t.length-1],Date.parse("2027-07-01")));
  const layout={margin:{l:52,r:10,t:8,b:28},height:380,paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"rgba(0,0,0,0)",
    font:{color:"#aebccf",size:10},showlegend:true,legend:{orientation:"h",y:1.14,font:{size:10}},shapes:bandShapes(PH_MODE),
    xaxis:{gridcolor:"rgba(255,255,255,.05)",linecolor:"#243448",type:"date",range:["2013-01-01",xEnd]},
    yaxis:{gridcolor:"rgba(255,255,255,.05)",linecolor:"#243448",type:"log",tickprefix:"$",title:{text:"BTC (log)",font:{size:9}}},
    hovermode:"x unified",hoverlabel:{bgcolor:"#141f2e",bordercolor:"#243448",font:{size:11,color:"#e8eef7"}}};
  window.Plotly.react("phaseChart",traces,layout,{displayModeBar:false,responsive:true}).then(gd=>{
    if(!PH_BOUND&&gd&&gd.on){gd.on("plotly_relayout",phAutoY);PH_BOUND=true;}});
}
function phAutoY(ev){
  if(PH_YLOCK||!ev||!PH_XS)return;const gd=document.getElementById("phaseChart");if(!gd||!window.Plotly)return;
  if(ev["xaxis.autorange"]){PH_YLOCK=true;window.Plotly.relayout(gd,{"yaxis.autorange":true}).then(()=>{PH_YLOCK=false;});return;}
  const r0=ev["xaxis.range[0]"],r1=ev["xaxis.range[1]"];if(r0==null||r1==null)return;
  const t0=Date.parse(r0),t1=Date.parse(r1);let lo=Infinity,hi=-Infinity;
  for(let i=0;i<PH_XS.length;i++){const tt=Date.parse(PH_XS[i]);if(tt<t0||tt>t1)continue;
    for(const arr of[PH_YS,PH_BM,PH_M2]){const v=arr[i];if(v!=null&&v>0){if(v<lo)lo=v;if(v>hi)hi=v;}}}
  if(!isFinite(lo)||!isFinite(hi)||hi<=0)return;
  PH_YLOCK=true;window.Plotly.relayout(gd,{"yaxis.range":[Math.log10(lo*0.85),Math.log10(hi*1.15)]}).then(()=>{PH_YLOCK=false;});
}

// ── gráfico principal + órdenes + backtest ──
function loadScript(u){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=u;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
async function loadPlotly(){if(window.Plotly)return;for(const u of["https://cdn.plot.ly/plotly-2.27.0.min.js","https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.27.0/plotly.min.js"]){try{await loadScript(u);if(window.Plotly)return;}catch(e){}}throw new Error("plotly");}
function band(r,c,o){return {type:"rect",xref:"x",yref:"paper",x0:r[0],x1:r[1],y0:0,y1:1,fillcolor:c,opacity:o,line:{width:0},layer:"below"};}
(async function(){
  let prices=null;
  try{await loadPlotly();const r=await fetch("https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=usd&days=max");prices=(await r.json()).prices;}catch(e){}
  if(!prices||!prices.length){document.querySelector(".chartcard").style.display="none";const bl=$("#btLoad");if(bl)bl.textContent=LANG==="es"?"No se pudo cargar el histórico de precios (fuente caída).":"Couldn't load price history (source down).";return;}
  const firstTouch=(lvl,from)=>{for(const p of prices){if(p[0]>=from&&p[1]<=lvl)return p[0];}return null;};
  dcaStartTs=firstTouch(60000,TOP);
  LADDER.forEach(o=>{ladderTouch[o.lvl]=firstTouch(o.lvl,JUL1);});
  // backtest + grafico de confluencia
  try{window.__btResult=runBacktest(prices);}catch(e){window.__btResult=null;}
  try{PH_D=weeklyResample(prices);}catch(e){PH_D=null;}
  render(); // re-render con órdenes + backtest + confluencia ya calculados
  if(!window.__btResult){const bl=$("#btBody");if(bl)bl.innerHTML=`<div class="btload">${LANG==="es"?"No hay suficientes datos para el backtest.":"Not enough data for the backtest."}</div>`;}

  if(!window.Plotly){document.querySelector(".chartcard").style.display="none";return;}
  const xs=[],ys=[];for(let i=0;i<prices.length;i+=3){xs.push(iso(prices[i][0]));ys.push(prices[i][1]);}
  const shapes=[];
  for(const tp of TOPS)shapes.push(band(tp,"#f2606d",.16));
  for(const f of FLOORS)shapes.push(band(f,"#2fd39b",.15));
  LADDER.forEach(o=>shapes.push({type:"line",xref:"paper",x0:0,x1:1,y0:o.lvl,y1:o.lvl,line:{color:"#e8a13a",width:1,dash:"dot"},opacity:.45,layer:"below"}));
  if(dcaStartTs)shapes.push({type:"line",xref:"x",yref:"paper",x0:iso(dcaStartTs),x1:iso(dcaStartTs),y0:0,y1:1,line:{color:"#2fd39b",width:1,dash:"dash"}});
  shapes.push({type:"line",xref:"x",yref:"paper",x0:iso(now),x1:iso(now),y0:0,y1:1,line:{color:"#fff",width:1.5,dash:"dot"}});
  const layout={paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"rgba(0,0,0,0)",margin:{l:44,r:8,t:6,b:24},height:300,font:{color:"#7f92ab",size:10,family:"inherit"},showlegend:false,shapes,
    xaxis:{gridcolor:"rgba(255,255,255,.04)",linecolor:"#243448",color:"#7f92ab",type:"date",range:["2012-06-01",iso(NEXT_TOP+60*DAY)]},
    yaxis:{type:"log",gridcolor:"rgba(255,255,255,.05)",linecolor:"#243448",color:"#7f92ab",tickprefix:"$",tickvals:[10,100,1000,10000,100000],ticktext:["$10","$100","$1k","$10k","$100k"]}};
  window.Plotly.react("chart",[{x:xs,y:ys,mode:"lines",line:{color:"#eef2f8",width:1.4},hovertemplate:"%{x}<br>$%{y:,.0f}<extra></extra>"}],layout,{responsive:true,displayModeBar:false});
})();
