name: Backfill de transcripts (histórico)

# Manual. Trae el HISTÓRICO completo de transcripts de cada persona (p.ej. 2021 de
# LMEC + huecos). Corre en runners de GitHub, que SÍ tienen salida a YouTube.
# Es idempotente: no re-baja lo que ya existe. Dispáralo desde Actions → Run workflow.

on:
  workflow_dispatch:
    inputs:
      persona:
        description: "Agente a rellenar"
        type: choice
        default: "all"
        options: ["all", "lmec", "cowen", "onchainmind"]
      since:
        description: "Desde fecha YYYYMMDD (20210101 = ciclo completo)"
        default: "20210101"
      max:
        description: "Máx vídeos por canal (0 = todos; Cowen tiene muchísimos)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: backfill-transcripts
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar yt-dlp
        run: python -m pip install --quiet yt-dlp

      - name: LMEC (es)
        if: ${{ inputs.persona == 'all' || inputs.persona == 'lmec' }}
        continue-on-error: true
        run: |
          python agentes/tools/fetch_captions.py --persona lmec --lang es \
            --max ${{ inputs.max }} --since ${{ inputs.since }} \
            "https://www.youtube.com/@LaMejorEstrategiaCriptomonedas/videos"

      - name: Cowen (en)
        if: ${{ inputs.persona == 'all' || inputs.persona == 'cowen' }}
        continue-on-error: true
        run: |
          python agentes/tools/fetch_captions.py --persona cowen --lang en \
            --max ${{ inputs.max }} --since ${{ inputs.since }} \
            "https://www.youtube.com/@IntoTheCryptoverse/videos"

      - name: OnChainMind (en)
        if: ${{ inputs.persona == 'all' || inputs.persona == 'onchainmind' }}
        continue-on-error: true
        run: |
          python agentes/tools/fetch_captions.py --persona onchainmind --lang en \
            --max ${{ inputs.max }} --since ${{ inputs.since }} \
            "https://www.youtube.com/@OnChainMind/videos"

      - name: Commit de transcripts nuevos
        run: |
          git config user.name "transcript-bot"
          git config user.email "actions@users.noreply.github.com"
          git add agentes/*/yt-transcripts/
          git diff --cached --quiet || git commit -m "transcripts: backfill histórico desde ${{ inputs.since }} (${{ inputs.persona }}) [skip ci]"
          git push
